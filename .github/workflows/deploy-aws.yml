# CI/CD: VS Code -> GitHub -> AWS (EC2 del Learner Lab)
# En cada push a main se comprueba que el código compila y se redespliega la parte Cloud en la EC2.
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   EC2_HOST     IP pública actual de la EC2 (cambia al reiniciar el Learner Lab)
#   EC2_USER     usuario SSH (ubuntu en AMIs de Ubuntu, ec2-user en Amazon Linux)
#   EC2_SSH_KEY  contenido de la clave privada .pem (labsuser.pem)

name: Deploy Cloud (AWS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q common WM_Central WM_WS WM_FO

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/SD-Practica1
            git pull --ff-only
            cd deploy/cloud
            docker compose up -d --build
            docker compose ps
